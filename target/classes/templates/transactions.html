<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Transactions')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-list-ul"></i> Transaction History</h2>
        <a th:href="@{/transactions/add}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Trade
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${transactions.isEmpty()}" class="text-center py-5 text-muted">
                <p>No transactions yet.</p>
            </div>
            <div th:unless="${transactions.isEmpty()}" class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Symbol</th>
                            <th>Type</th>
                            <th class="text-end">Qty</th>
                            <th class="text-end">Price</th>
                            <th class="text-end">Total Value</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${transactions}">
                            <td th:text="${#temporals.format(t.transactionDate, 'dd-MMM-yyyy')}">Date</td>
                            <td><strong th:text="${t.stock.symbol}">SYM</strong></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${t.type.name() == 'BUY'} ? 'bg-success' : 'bg-danger'"
                                      th:text="${t.type}">BUY</span>
                            </td>
                            <td class="text-end" th:text="${t.quantity}">0</td>
                            <td class="text-end">&#8377; <span th:text="${t.price}">0</span></td>
                            <td class="text-end">&#8377; <span th:text="${#numbers.formatDecimal(t.totalValue, 0, 'COMMA', 2, 'POINT')}">0</span></td>
                            <td class="text-end">
                                <form th:action="@{'/transactions/delete/' + ${t.id}}" method="post" style="display:inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Delete this transaction?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
